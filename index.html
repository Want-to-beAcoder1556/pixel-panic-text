<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colored ASCII Textbox Snake</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* The Colored Text Canvas */
        #screen {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #00ffaa;
            border-radius: 8px;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            white-space: pre;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
            line-height: 1;
        }

        #ui-layer {
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000, 2px 2px 4px rgba(0,255,170,0.5);
            font-size: 1.5rem;
        }

        #game-over-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            border: 2px solid #ff0055;
            padding: 30px;
            border-radius: 12px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            z-index: 20;
            text-align: center;
        }
        
        #game-over-ui h2 { margin: 0 0 10px 0; color: #ff0055; font-size: 2.5rem; }
        #game-over-ui p { margin: 5px 0; font-size: 1.2rem; }

        /* Mobile D-Pad Controls */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 200px;
            height: 200px;
        }

        .d-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
        }

        .d-btn:active { background-color: rgba(255, 255, 255, 0.3); }

        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        @media (min-width: 768px) {
            .d-pad { display: none; } /* Hide on PC */
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            SCORE: <span id="score">0</span>
        </div>

        <!-- The Text Engine Display -->
        <pre id="screen"></pre>
        
        <div id="game-over-ui">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <p style="font-size: 0.8rem; margin-top: 15px; color: #ffcc00;">[ Press ENTER to Restart ]</p>
        </div>

        <!-- Mobile Controls -->
        <div class="d-pad">
            <div class="d-btn up" id="btn-up">▲</div>
            <div class="d-btn left" id="btn-left">◀</div>
            <div class="d-btn right" id="btn-right">▶</div>
            <div class="d-btn down" id="btn-down">▼</div>
        </div>
    </div>

    <script>
        // --- Engine & Grid Setup ---
        const width = 40;  // Columns in the textbox
        const height = 24; // Rows in the textbox
        const screen = document.getElementById('screen');
        const scoreEl = document.getElementById('score');
        const gameOverUi = document.getElementById('game-over-ui');
        const finalScoreEl = document.getElementById('final-score');

        // Color Palette
        const C_WALL  = "#445566"; // Border wall color
        const C_EMPTY = "#1a1a20"; // Background dots
        const C_HEAD  = "#00ffcc"; // Snake Head
        const C_BODY  = "#00aa88"; // Snake Body
        const C_FOOD  = "#ff3366"; // Food

        // Characters for different objects
        const CHAR_WALL  = "#";
        const CHAR_EMPTY = ".";
        const CHAR_HEAD  = "@";
        const CHAR_BODY  = "O";
        const CHAR_FOOD  = "*";

        // Auto-scale font size to fit the screen
        function resize() {
            let w = window.innerWidth;
            let h = window.innerHeight;
            let dPadHeight = window.innerWidth < 768 ? 250 : 50; // Leave space for controls on mobile
            let charAspect = 0.6;
            
            let fontSizeW = (w * 0.9) / (width * charAspect);
            let fontSizeH = ((h - dPadHeight) * 0.8) / height;
            let fontSize = Math.min(fontSizeW, fontSizeH);
            
            screen.style.fontSize = fontSize + "px";
            screen.style.lineHeight = fontSize + "px";
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Game State ---
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameOver = false;
        let inputQueue = [];
        
        let lastRenderTime = 0;
        let baseSpeed = 10; // Frames per second

        function init() {
            // Start snake in the center
            snake = [
                { x: Math.floor(width/2), y: Math.floor(height/2) },
                { x: Math.floor(width/2), y: Math.floor(height/2) + 1 },
                { x: Math.floor(width/2), y: Math.floor(height/2) + 2 }
            ];
            dx = 0;
            dy = -1;
            score = 0;
            gameOver = false;
            inputQueue = [];
            scoreEl.innerText = score;
            gameOverUi.style.display = 'none';
            
            placeFood();
            requestAnimationFrame(gameLoop);
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                // Ensure food spawns inside the walls
                food = {
                    x: Math.floor(Math.random() * (width - 2)) + 1,
                    y: Math.floor(Math.random() * (height - 2)) + 1
                };
                
                valid = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        // --- Main Game Loop ---
        function gameLoop(currentTime) {
            if (gameOver) return;
            window.requestAnimationFrame(gameLoop);

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            const currentSpeed = baseSpeed + (score * 0.2); 
            
            if (secondsSinceLastRender < 1 / currentSpeed) return;
            lastRenderTime = currentTime;

            update();
            renderFrame();
        }

        function update() {
            if (inputQueue.length > 0) {
                const nextInput = inputQueue.shift();
                dx = nextInput.dx;
                dy = nextInput.dy;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x <= 0 || head.x >= width - 1 || head.y <= 0 || head.y >= height - 1) {
                triggerGameOver();
                return;
            }

            // Self Collision Check
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        // --- The Colored Text Renderer ---
        function renderFrame() {
            // 1. Create a 2D array to hold our text frame
            let buffer = [];
            for (let y = 0; y < height; y++) {
                let row = [];
                for (let x = 0; x < width; x++) {
                    // Draw borders
                    if (y === 0 || y === height - 1 || x === 0 || x === width - 1) {
                        row.push({ char: CHAR_WALL, color: C_WALL });
                    } else {
                        row.push({ char: CHAR_EMPTY, color: C_EMPTY });
                    }
                }
                buffer.push(row);
            }

            // 2. Draw Food into the buffer
            buffer[food.y][food.x] = { char: CHAR_FOOD, color: C_FOOD };

            // 3. Draw Snake into the buffer
            for (let i = 0; i < snake.length; i++) {
                let seg = snake[i];
                if (i === 0) {
                    buffer[seg.y][seg.x] = { char: CHAR_HEAD, color: C_HEAD };
                } else {
                    buffer[seg.y][seg.x] = { char: CHAR_BODY, color: C_BODY };
                }
            }

            // 4. Convert buffer array to colored HTML String
            let output = "";
            let lastColor = null;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let cell = buffer[y][x];
                    
                    // Optimization: Only open a new <span> if the color changes!
                    if (cell.color !== lastColor) {
                        if (lastColor !== null) output += "</span>";
                        output += `<span style="color:${cell.color}">`;
                        lastColor = cell.color;
                    }
                    output += cell.char;
                }
                output += "\n";
            }
            if (lastColor !== null) output += "</span>";

            // 5. Blast it to the screen!
            screen.innerHTML = output;
        }

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.innerText = score;
            gameOverUi.style.display = 'flex';
        }

        // --- Controls ---
        function changeDirection(newDx, newDy) {
            let currentDx = dx, currentDy = dy;
            if (inputQueue.length > 0) {
                currentDx = inputQueue[inputQueue.length - 1].dx;
                currentDy = inputQueue[inputQueue.length - 1].dy;
            }

            // Can't reverse into yourself
            if (newDx !== 0 && currentDx === -newDx) return;
            if (newDy !== 0 && currentDy === -newDy) return;

            if (inputQueue.length < 2) {
                inputQueue.push({ dx: newDx, dy: newDy });
            }
        }

        window.addEventListener('keydown', (e) => {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch (e.key) {
                case 'ArrowUp':   case 'w': case 'W': changeDirection(0, -1); break;
                case 'ArrowDown': case 's': case 'S': changeDirection(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': changeDirection(-1, 0); break;
                case 'ArrowRight':case 'd': case 'D': changeDirection(1, 0); break;
                case 'Enter':     case ' ': if (gameOver) init(); break;
            }
        });

        // Mobile D-Pad
        const dpadMap = { 'btn-up': [0,-1], 'btn-down': [0,1], 'btn-left': [-1,0], 'btn-right': [1,0] };
        for (const [id, dir] of Object.entries(dpadMap)) {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(dir[0], dir[1]); });
            el.addEventListener('mousedown', () => changeDirection(dir[0], dir[1]));
        }

        // Start!
        init();
    </script>
</body>
</html>
