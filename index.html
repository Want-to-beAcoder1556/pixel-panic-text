<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ASCII Box Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* * Replaced textarea with a <pre> block so we can use inline colors! 
         * Styled to look exactly like the previous textbox.
         */
        #screen {
            background-color: #000000;
            color: #00ffaa;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #00ffaa;
            border-radius: 8px;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            white-space: pre;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000, 2px 2px 4px rgba(0,255,170,0.5);
            font-size: 1.2rem;
            z-index: 10;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            color: #88ffcc;
            font-size: 0.9rem;
            opacity: 0.8;
            z-index: 10;
        }

        #game-over-ui {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            border: 2px solid #ff0055;
            padding: 30px;
            border-radius: 12px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            z-index: 20;
        }
        
        #game-over-ui h2 { margin: 0 0 10px 0; color: #ff0055; font-size: 2.5rem; }
        #game-over-ui p { margin: 5px 0; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Colored Text Canvas -->
        <pre id="screen"></pre>
        
        <div id="ui-layer">
            SCORE: <span id="score">0</span>
        </div>
        
        <div id="game-over-ui">
            <h2>CRASH!</h2>
            <p>Score: <span id="final-score">0</span></p>
            <p style="font-size: 0.8rem; margin-top: 15px; color: #ffcc00;">[ Press ENTER or SPACE to Restart ]</p>
        </div>

        <div class="instructions">
            [ A / D ] or [ Arrow Keys ] to Move<br>
            Tap left/right side of screen on Mobile<br>
            Avoid the incoming 3D blocks!
        </div>
    </div>

    <script>
        // Game Constants & Engine Setup
        const width = 120;  // Character columns (Good detail, balanced size)
        const height = 50;  // Character rows (Good detail, balanced size)
        const screen = document.getElementById('screen');
        const scoreEl = document.getElementById('score');
        const gameOverUi = document.getElementById('game-over-ui');
        const finalScoreEl = document.getElementById('final-score');

        // Character density gradient from darkest (background) to brightest (highlights)
        const chars = " .:-=+*#%@"; 
        const obsColors = ["#ff3366", "#33ccff", "#ffdd33", "#cc33ff", "#ff8833", "#33ff55"];
        
        let aspectAdjustment = 1.0;

        // Auto-scale font size to fit grid
        function resize() {
            let w = window.innerWidth;
            let h = window.innerHeight;
            let charAspect = 0.6;
            
            let fontSizeW = (w * 0.9) / (width * charAspect);
            let fontSizeH = (h * 0.8) / height;
            let fontSize = Math.min(fontSizeW, fontSizeH);
            
            screen.style.fontSize = fontSize + "px";
            screen.style.lineHeight = fontSize + "px";
            aspectAdjustment = (width / height) * charAspect;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Vector Math
        function length(x, y, z) { return Math.sqrt(x*x + y*y + z*z); }
        
        function rotX(v, a) {
            let c = Math.cos(a), s = Math.sin(a);
            return { x: v.x, y: v.y * c - v.z * s, z: v.y * s + v.z * c };
        }
        function rotY(v, a) {
            let c = Math.cos(a), s = Math.sin(a);
            return { x: v.x * c + v.z * s, y: v.y, z: -v.x * s + v.z * c };
        }

        function sdBox(p, b) {
            let dx = Math.abs(p.x) - b.x;
            let dy = Math.abs(p.y) - b.y;
            let dz = Math.abs(p.z) - b.z;
            return length(Math.max(dx, 0), Math.max(dy, 0), Math.max(dz, 0)) + Math.min(Math.max(dx, Math.max(dy, dz)), 0.0);
        }

        // --- Game State ---
        let playerX = 0;
        let targetPlayerX = 0;
        let obstacles = [];
        let time = 0;
        let score = 0;
        let gameOver = false;
        let speed = 0.3;

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => {
            if (gameOver) {
                if (e.key === 'Enter' || e.key === ' ') resetGame();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') targetPlayerX -= 1.8;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') targetPlayerX += 1.8;
            targetPlayerX = Math.max(-4.5, Math.min(4.5, targetPlayerX));
        });

        window.addEventListener('touchstart', (e) => {
            if (gameOver) { resetGame(); return; }
            let touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) targetPlayerX -= 1.8;
            else targetPlayerX += 1.8;
            targetPlayerX = Math.max(-4.5, Math.min(4.5, targetPlayerX));
        });

        function resetGame() {
            score = 0;
            speed = 0.3;
            obstacles = [];
            playerX = 0;
            targetPlayerX = 0;
            gameOver = false;
            scoreEl.innerText = score;
            gameOverUi.style.display = "none";
            gameLoop();
        }

        // --- 3D Scene Map ---
        let currentMat = "#000000";

        // Calculates distance to the nearest surface, and saves its color if asked
        function mapScene(p, saveMaterial = false) {
            let d = 1000.0; // Start with a very large distance (removed ground plane)
            let mat = "#000000"; // Default empty space color

            // Player Box
            let pPlayer = {x: p.x - playerX, y: p.y - (-1), z: p.z - (-2)};
            let dPlayer = sdBox(pPlayer, {x: 0.6, y: 0.6, z: 0.6});
            if (dPlayer < d) { d = dPlayer; mat = "#ffffff"; }

            // Obstacle Boxes
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                let pObs = {x: p.x - obs.x, y: p.y - obs.y, z: p.z - obs.z};
                pObs = rotY(pObs, time * 2.5 + i);
                pObs = rotX(pObs, time * 2.0 + i);
                let dObs = sdBox(pObs, {x: obs.w, y: obs.h, z: obs.d});
                
                if (dObs < d) { d = dObs; mat = obs.color; }
            }
            
            if (saveMaterial) currentMat = mat;
            return d;
        }

        function calcNormal(p) {
            const e = 0.01;
            const d = mapScene(p);
            return {
                x: mapScene({x: p.x + e, y: p.y, z: p.z}) - d,
                y: mapScene({x: p.x, y: p.y + e, z: p.z}) - d,
                z: mapScene({x: p.x, y: p.y, z: p.z + e}) - d
            };
        }

        function normalize(v) {
            let l = length(v.x, v.y, v.z);
            if (l === 0) return {x:0, y:0, z:0};
            return {x: v.x/l, y: v.y/l, z: v.z/l};
        }

        // --- The Colored ASCII Renderer ---
        function renderFrame() {
            let output = "";
            let lastColor = null;
            let lightDir = normalize({x: -1, y: 2.5, z: -1});
            let ro = {x: 0, y: 1.5, z: -8}; 
            let camPitch = 0.25; 

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let uvX = (x / width) * 2 - 1;
                    
                    // FIXED: Inverted the Y axis so the camera projects right-side up!
                    let uvY = 1.0 - (y / height) * 2.0; 
                    
                    uvX *= aspectAdjustment;

                    let rd = normalize({x: uvX, y: uvY, z: 1.0});
                    rd = rotX(rd, camPitch);

                    let t = 0;
                    let hit = false;
                    
                    for (let i = 0; i < 40; i++) {
                        let p = {x: ro.x + rd.x * t, y: ro.y + rd.y * t, z: ro.z + rd.z * t};
                        let d = mapScene(p);
                        if (d < 0.01) { hit = true; break; }
                        t += d;
                        if (t > 35.0) break;
                    }

                    if (hit) {
                        let p = {x: ro.x + rd.x * t, y: ro.y + rd.y * t, z: ro.z + rd.z * t};
                        let n = normalize(calcNormal(p));
                        
                        // Extract color exactly at collision point
                        mapScene(p, true);
                        let charColor = currentMat;

                        let diff = Math.max(0, n.x * lightDir.x + n.y * lightDir.y + n.z * lightDir.z);
                        let intensity = 0.15 + diff * 0.85;

                        // Soft Shadows
                        let shadowHit = false;
                        let st = 0.05;
                        for(let i=0; i < 15; i++) {
                            let sp = {x: p.x + lightDir.x * st, y: p.y + lightDir.y * st, z: p.z + lightDir.z * st};
                            let sd = mapScene(sp);
                            if(sd < 0.01) { shadowHit = true; break; }
                            st += sd;
                            if(st > 10.0) break;
                        }
                        if (shadowHit) intensity *= 0.35;

                        let charIndex = Math.max(0, Math.min(chars.length - 1, Math.floor(intensity * chars.length)));
                        let char = chars[charIndex];

                        // Open/close HTML spans ONLY when the color changes to maximize speed
                        if (charColor !== lastColor) {
                            if (lastColor !== null) output += "</span>";
                            output += `<span style="color:${charColor}">`;
                            lastColor = charColor;
                        }
                        output += char;

                    } else {
                        // Empty space doesn't need a color span
                        if (lastColor !== null) {
                            output += "</span>";
                            lastColor = null;
                        }
                        output += " ";
                    }
                }
                output += "\n";
            }
            if (lastColor !== null) output += "</span>";
            
            // Push final assembled HTML string to the screen buffer
            screen.innerHTML = output;
        }

        // --- Main Game Loop ---
        function gameLoop() {
            if (!gameOver) {
                playerX += (targetPlayerX - playerX) * 0.25;

                if (Math.random() < 0.06 + (score * 0.001)) {
                    let ox = (Math.floor(Math.random() * 5) - 2) * 1.8;
                    let randColor = obsColors[Math.floor(Math.random() * obsColors.length)];
                    obstacles.push({x: ox, y: -1, z: 25, w: 0.7, h: 0.7, d: 0.7, color: randColor});
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.z -= speed;

                    if (Math.abs(obs.x - playerX) < 1.3 && Math.abs(obs.z - (-2.0)) < 1.3) {
                        gameOver = true;
                        finalScoreEl.innerText = score;
                        gameOverUi.style.display = "flex";
                    }

                    if (obs.z < -6) {
                        obstacles.splice(i, 1);
                        score++;
                        scoreEl.innerText = score;
                        speed += 0.005;
                    }
                }
                time += 0.05;
            }

            renderFrame();
            
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start
        gameLoop();
    </script>
</body>
</html>
